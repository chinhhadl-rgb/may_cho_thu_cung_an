; PlatformIO Project Configuration File for ESP32 Pet Feeder Simulation in Wokwi
[platformio]
src_dir = .
include_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    adafruit/RTClib @ ^2.1.3
    madhephaestus/ESP32Servo @ ^3.0.5
    256dpi/MQTT @ ^2.5.2
    bblanchon/ArduinoJson @ ^7.0.4
